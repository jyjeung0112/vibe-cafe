<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바이브 카페 - 주문서</title>
    <!-- 외부 스타일시트 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- [페이지 상단] 카페 헤더 영역 -->
    <header>
        <div class="logo" style="font-size: 3rem;">☕</div>
        <h1>바이브 카페</h1>
        <p>당신의 하루에 바이브를 더하다</p>
    </header>

    <!-- [메인 컨테이너] -->
    <main>
        <!-- 카페 이름 아래 탭 메뉴 (주문하기 / 주문 내역) -->
        <div class="tab-menu" role="tablist">
            <button type="button" class="tab-btn active" id="tab-btn-order" role="tab" aria-selected="true">
                ☕ 주문하기
            </button>
            <button type="button" class="tab-btn" id="tab-btn-history" role="tab" aria-selected="false">
                📋 주문 내역 <span id="order-count-badge" class="badge">0</span>
            </button>
        </div>

        <!-- [주문하기 탭 컨텐츠] -->
        <div id="tab-order" class="tab-content">
            <!-- [주문서 폼 영역] (이름 검사는 JS에서 수행하므로 novalidate 지정) -->
            <form id="order-form" novalidate>

            <!-- 1. 이름 (필수, text) -->
            <div>
                <label for="customer-name">이름</label>
                <input type="text" id="customer-name" name="customer-name">
            </div>

            <!-- 2. 전화번호 (tel) -->
            <div>
                <label for="customer-phone">전화번호</label>
                <input type="tel" id="customer-phone" name="customer-phone">
            </div>

            <!-- 3. 음료 선택 (드롭다운) -->
            <div>
                <label for="beverage">음료 선택</label>
                <select id="beverage" name="beverage">
                    <option value="" data-price="0">-- 음료를 선택하세요 --</option>
                    <option value="americano" data-price="3500">아메리카노 3,500원</option>
                    <option value="latte" data-price="4000">카페라떼 4,000원</option>
                    <option value="mocha" data-price="4500">카페모카 4,500원</option>
                    <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
                    <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
                </select>
            </div>

            <!-- 4. 사이즈 (라디오) -->
            <fieldset>
                <legend>사이즈</legend>
                <div>
                    <input type="radio" id="size-s" name="size" value="S" data-price="0">
                    <label for="size-s">S +0원</label>
                </div>
                <div>
                    <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
                    <label for="size-m">M +500원</label>
                </div>
                <div>
                    <input type="radio" id="size-l" name="size" value="L" data-price="1000">
                    <label for="size-l">L +1,000원</label>
                </div>
            </fieldset>

            <!-- 5. 추가 옵션 (체크박스) -->
            <fieldset>
                <legend>추가 옵션</legend>
                <div>
                    <input type="checkbox" id="option-shot" name="option" value="shot" data-price="500">
                    <label for="option-shot">샷 추가 +500원</label>
                </div>
                <div>
                    <input type="checkbox" id="option-cream" name="option" value="cream" data-price="500">
                    <label for="option-cream">크림 추가 +500원</label>
                </div>
                <div>
                    <input type="checkbox" id="option-syrup" name="option" value="syrup" data-price="300">
                    <label for="option-syrup">시럽 추가 +300원</label>
                </div>
                <div>
                    <input type="checkbox" id="option-decaf" name="option" value="decaf" data-price="0">
                    <label for="option-decaf">디카페인 +0원</label>
                </div>
            </fieldset>

            <!-- 6. 수량 (number) -->
            <div>
                <label for="quantity">수량</label>
                <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
            </div>

            <!-- 7. 요청사항 (textarea) -->
            <div>
                <label for="requests">요청사항</label>
                <textarea id="requests" name="requests" rows="4"></textarea>
            </div>

            <!-- 8. 예상 금액 표시 영역 -->
            <div id="total-price-area">
                예상 금액: <span id="total-price">0</span>원
            </div>

            <!-- 9. 주문하기 버튼 & 10. 다시 작성 버튼 -->
            <div>
                <button type="submit" id="submit-btn">주문하기</button>
                <button type="reset" id="reset-btn">다시 작성</button>
            </div>

        </form>

        <!-- 11. 주문 확인 메시지가 나올 빈 영역 (처음에는 숨김) -->
        <div id="order-confirmation" class="hidden"></div>
    </div>

    <!-- [주문 내역 탭 컨텐츠] 접수된 주문 목록 (처음에는 숨김) -->
    <div id="tab-history" class="tab-content hidden">
        <!-- 주문 목록이 들어갈 컨테이너 -->
        <div id="order-list"></div>

        <!-- 주문이 없을 때 안내 메시지 -->
        <div id="empty-history" class="empty-message">
            아직 주문 내역이 없어요 ☕
        </div>

        <!-- 주문 내역 통계 요약 및 전체 삭제 버튼 -->
        <div id="history-summary" class="history-summary hidden">
            <div id="total-history-amount" class="total-history-amount">총 주문 금액: 0원 (0건)</div>
            <button type="button" id="clear-all-orders-btn" class="clear-all-btn">내역 모두 지우기</button>
        </div>
    </div>
</main>

    <!-- Supabase JS v2 라이브러리 CDN 연결 (script.js보다 먼저 로드) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 외부 스크립트 연결 -->
    <script src="script.js"></script>
</body>
</html>
